[package]
name = "whispr-open"
version = "0.7.0"
description = "Local open-source dictation workspace (native desktop)"
authors = ["Whispr Open contributors"]
edition = "2021"
license = "MIT"

# Identidad del ejecutable: la app se llama Silb -> `silb.exe`.
# ponytail: el PAQUETE sigue siendo `whispr-open` (y el crate `whispr_open`)
# porque el directorio de datos del usuario (%APPDATA%\whispr-open) es literal
# en config.rs/log.rs/transcribe.rs: renombrarlo dejaría sin ajustes a quien ya
# tiene la app instalada. Solo cambia el nombre del binario.
[[bin]]
name = "silb"
path = "src/main.rs"

[features]
default = []
# Backend GPU de whisper.cpp (exige toolkit CUDA y CUDA_PATH).
cuda = ["whisper-rs/cuda"]

[dependencies]
# UI nativa (sin webview). `image` activa el widget `image` de iced y el
# crate `image` 0.25 (que ya está en Cargo.lock) para que el usuario pueda
# poner su propia imagen de fondo y un sprite o animación por frames en la
# burbuja flotante (ver src/custom_image.rs). `svg` habilita el widget `svg`:
# los iconos del diseño (lucide, extraídos del Figma a assets/icons/) se
# incrustan en el binario y se pintan vectoriales (ver src/ui/icons.rs).
iced = { version = "0.13", features = ["tokio", "image", "svg"] }

# Multi-ventana de Iced (la burbuja flotante es una segunda ventana del mismo
# proceso, con vista y tema propios por window::Id)
iced_winit = { version = "0.13", features = ["program"] }

# Estilos de ventana Windows: WS_EX_NOACTIVATE en la burbuja para que los
# clics no roben el foco de la app donde se dicta + tema auto (AppsUseLightTheme
# del registro), geometry de ventanas (posicion/esquina/tamano por winapi) y
# guard de instancia única (CreateMutexW, ver src/single_instance.rs).
winapi = { version = "0.3", features = ["winuser", "windef", "winreg", "winnt", "minwindef", "wincred", "processthreadsapi", "handleapi", "synchapi", "errhandlingapi"] }

# Bandeja del sistema: icono en el tray de Windows + menú contextual
# (Mostrar/Ocultar ventana, Salir). En Windows crea una ventana oculta en el
# hilo llamante (el del bucle de winit) y entrega los eventos por canal global
# (misma mecánica que global-hotkey); ver src/tray.rs
tray-icon = "0.24"

# Audio + transcripción
cpal = "0.15"
# CPU por defecto: con MSVC + CMake se compila sin toolkit CUDA. Para GPU:
#   cargo build --release --features cuda
# whisper-rs elige backend con cfg!(feature = "_gpu"): sin `cuda` deja
# use_gpu=false y whisper.cpp corre en CPU sin avisos ni pánicos.
whisper-rs = { version = "0.16" }

# Inyección de texto en app activa
arboard = "3.6.1"
enigo = "0.6.1"

# Atajo global
global-hotkey = "0.6"
crossbeam-channel = "0.5"

# Descarga de modelos + config
ureq = { version = "2.12", features = ["tls"] }

# Selector de archivos nativo (Ajustes → ruta del server LLM «Examinar…»):
# diálogo de Windows sin webview. Solo se toca desde el UI thread.
rfd = "0.15"
# Decodificación de GIF animado para la burbuja (un solo archivo, sprint
# final). Solo el codec gif, sin default-features: evita arrastrar rav1e/
# avif al árbol y al binario (iced ya trae lo suyo por separado).
image = { version = "0.25", default-features = false, features = ["gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Dominio (port de la lógica TS)
fancy-regex = "0.14"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# [Linux/macOS] kill(2) para terminar el server LLM que lanzó la app
# (SIGTERM limpio + SIGKILL de rescate; ver llm::terminate_server_pid).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests de glifos emoji: replica el FontSystem de Iced (cosmic-text) para
# verificar que los símbolos de la UI (✓ ☀ ☾ ▾ ▸ ● → ✕) no quedan en
# .notdef ("caja vacía") tras cargar la fuente emoji. Misma versión 0.12.1
# que ya está en el lockfile vía iced_graphics (sin compilación extra).
cosmic-text = "0.12"

[build-dependencies]
# Incrusta el icono .ico y el manifest en el .exe de Windows (solo se usa
# en Windows: ver build.rs).
winresource = "0.1"

[profile.release]
lto = true
strip = true