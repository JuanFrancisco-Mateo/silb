[package]
name = "whispr-open"
version = "0.3.0"
description = "Local open-source dictation workspace (native desktop)"
authors = ["Whispr Open contributors"]
edition = "2021"
license = "MIT"

# NOTA DE INTEGRACION (rama feature/port-linux, integrador dev-02):
# Cargo.toml unificado desde las 4 ramas del port (P1 inventario, P2
# codigo-core, P3 audio-runtime, P4 dominio-ui). Decisions de adjudicacion:
#   - [features]: SOLO `cuda = ["whisper-rs/cuda"]`, `default = []`. CUDA off
#     por defecto en todos los SO; el build de Windows con RTX 4070 se
#     compila con `--features cuda`.
#   - [dependencies]: deps multiplataforma o compilables en Linux (incluye
#     arboard, global-hotkey y crossbeam-channel, que compilan en Linux).
#   - [target.'cfg(windows)'.dependencies]: winapi, enigo, rfd.
#   - [target.'cfg(not(target_os = "linux"))'.dependencies]: tray-icon
#     (src/tray.rs degrada a stub en Linux: falta backend AppIndicator +
#     host de StatusNotifier en Hyprland; ver docs/PORT-LINUX/AUDIO-RUNTIME.md).
#   - [target.'cfg(unix)'.dependencies]: libc (senales SIGTERM/SIGKILL para
#     el server LLM; llm::terminate_server_pid (ver AUDIO-RUNTIME.md)).
#   - [target.'cfg(windows)'.build-dependencies]: winresource (build.rs).
# Las ramas intermedias P2/P3/P4 dejaron secciones desplazadas (deps dentro
# de la seccion TOML equivocada): aqui queda el layout normalizado, ordense
# con seccion [dependencies] universal, [features] solo cuda, y el detalle
# de adjudicacion en docs/PORT-LINUX/INTEGRACION.md.

[features]
default = []
# Aceleración GPU nvidia de whisper.cpp (CUDA). OFF por defecto: el port a
# Linux corre en una máquina sin GPU nvidia. Actívalo con `--features cuda`
# en la build de Windows con RTX 4070 (build histórica en E:\AI\FREEBUFF).
cuda = ["whisper-rs/cuda"]

[dependencies]
# UI nativa (sin webview). `image` activa el widget `image` de iced y el
# crate `image` 0.25 (que ya está en Cargo.lock) para que el usuario pueda
# poner su propia imagen de fondo y un sprite o animación por frames en la
# burbuja flotante (ver src/custom_image.rs).
iced = { version = "0.13", features = ["tokio", "image"] }

# Multi-ventana de Iced (la burbuja flotante es una segunda ventana del mismo
# proceso, con vista y tema propios por window::Id)
iced_winit = { version = "0.13", features = ["program"] }

# Audio + transcripción. `cuda` OFF POR DEFECTO en ambos SO (adjudicado
# entre P3 y P4; ver NOTA DE INTEGRACION arriba): whisper-rs sin default
# features -> build CPU whisper.cpp, sin cublas. La GPU NV del build de
# Windows con RTX 4070 se recupera con `--features cuda` ([features]).
# Estimación honesta CPU-only: docs/PORT-LINUX/AUDIO-RUNTIME.md.
cpal = "0.15"
whisper-rs = { version = "0.16", default-features = false }
# Portapapeles multiplataforma: funciona en Windows, macOS y Linux tanto
# X11 como Wayland (backend clipboard_wayland/smithay-clipboard, ya en el
# Cargo.lock). Se usa desde src/inject.rs (los usos de arboard en Linux van
# tras cfg(unix) o derivan del take del portapapeles; la ESCRITURA en Linux
# es wl-copy).
arboard = "3.6.1"

# Atajo global. Registro nativo del sistema en Windows (X11 en Linux, con
# backend por dlopen en Linux: no necesita libX11 en build). En Wayland no
# existe el grab global de X11; hotkey.rs usa ahí el backend «hyprland»
# (UNIX socket + bind de hyprland.conf, docs/PORT-LINUX/HOTKEY-HYPR.md), que
# fabrica `GlobalHotKeyEvent` por el mismo canal crossbeam.
# La dependencia NO se cfg-justa a Windows porque `app.rs`/`ui/poll.rs`
# usan `GlobalHotKeyEvent` sin cfg.
global-hotkey = "0.6"

# Canal hotkey/tray (src/hotkey.rs, src/tray.rs, src/app.rs)
crossbeam-channel = "0.5"

# Descarga de modelos + config
ureq = { version = "2.12", features = ["tls"] }

# Config / serialización / dominio (multiplataforma, ya estaba)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Dominio (port de la lógica TS)
fancy-regex = "0.14"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# ── Dependencias Windows-only (no compilan en Linux) ──
[target.'cfg(windows)'.dependencies]
# Estilos de ventana Windows: WS_EX_NOACTIVATE en la burbuja para que los
# clics no roben el foco de la app donde se dicta + tema auto (AppsUseLightTheme
# del registro), geometry de ventanas (posicion/esquina/tamano por winapi) y
# guard de instancia única (CreateMutexW, ver src/single_instance.rs).
# GATEADO a Windows (P2): en Linux nada de la API winapi compila y los dos
# módulos que la usaban (single_instance, inject) pasan por lock file +
# wl-copy/wtype/ydotool (ver docs/PORT-LINUX/CODIGO-CORE.md).
winapi = { version = "0.3", features = ["winuser", "windef", "winreg", "winnt", "minwindef", "wincred", "processthreadsapi", "handleapi", "synchapi", "errhandlingapi"] }

# Inyección de texto (src/inject.rs): enigo. En Wayland no tiene backend
# nativo (x11rb); el plan en Linux es wtype (ya instalado) / ydotool, y
# send_text por wl-copy + pegado en app activa (ver CODIGO-CORE.md).
enigo = "0.6.1"

# Selector de archivos nativo (ui/settings_handlers.rs «Examinar…»):
# rfd 0.15 soporta Linux vía GTK/ashpd(portal), pero el flujo nativo de
# tiempo de ejecución está verificado SOLO en Windows; queda gateada a
# Windows hasta revisar el runtime GTK (pendiente, ver INTEGRACION.md).
rfd = "0.15"

# Bandeja del sistema: icono en el tray de Windows + menú contextual
# (Mostrar/Ocultar ventana, Salir). En Windows crea una ventana oculta en el
# hilo llamante (el del bucle de winit) y entrega los eventos por canal global
# (misma mecánica que global-hotkey); ver src/tray.rs
#
# Linux: tray-icon 0.24 soporta Linux SOLO vía backend AppIndicator
# (docs.rs/tray-icon 0.24.2: plataforma «Linux (gtk Only)»,dependencias
# gtk3 + libappindicator/libayatana + libxdo en el sistema) y encima exige
# que el shell provea el Protocolo StatusNotifier. Hyprland no incluye un
# tray host por defecto, así que el backend real queda PENDIENTE (regla de
# honestidad de la task): en Linux no se compila la dependencia — evita
# requerir gtk3 en build time — y `src/tray.rs` degrada a stub; la app
# funciona sin bandeja (ventana + atajo + Salir en UI). Si en el futuro se
# decide ejecutar con un tray host (waybar con appindicator, etc.) se
# movería esta entrada DESPUÉS de instalar `gtk3 libappindicator-gtk3
# libxdo` por pacman y se reutilizaría la lógica de menú sin cambiar la
# API de src/tray.rs.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24"

# [Linux/macOS] Señales POSIX para terminar el server LLM lanzado por la app
# (SIGTERM limpio + SIGKILL de rescate; ver llm::terminate_server_pid).
# No compila en Windows (allí va winapi TerminateProcess).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
# Incrusta el icono .ico y el manifest en el .exe de Windows (solo se usa
# en Windows: ver build.rs, que ya está cfg-ed not(windows) no-op).
winresource = "0.1"

[dev-dependencies]
# Tests de glifos emoji: replica el FontSystem de Iced (cosmic-text) para
# verificar que los símbolos de la UI (✓ ☀ ☾ ▾ ▸ ● → ✕) no quedan en
# .notdef ("caja vacía") tras cargar la fuente emoji. Misma versión 0.12.1
# que ya está en el lockfile vía iced_graphics (sin compilación extra).
cosmic-text = "0.12"

[profile.release]
lto = true
strip = true
