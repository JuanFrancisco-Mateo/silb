name: CI

# Sin esto el repo público solo tenía el build de Pages: nada compilaba el código.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # La app es Windows de verdad (winapi, tray, enigo, rfd): no hay job Linux.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Compila whisper.cpp con el CMake del runner y pasa los tests de src/.
      - run: cargo test --locked
